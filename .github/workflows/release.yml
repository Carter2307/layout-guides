name: Release

# Un push sur main suffit. La version de package.json fait autorité : si elle
# n'est pas encore sur npm, la CI publie, tague et crée la Release GitHub.
# Les pushes qui ne touchent pas à la version ne déclenchent rien.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      # On interroge npm plutôt que les tags git : c'est le registre qui
      # tranche, et ça reste correct quelle que soit la façon dont tu as
      # bumpé la version en local.
      - name: La version est-elle déjà sur npm ?
        id: version
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION est déjà publié — rien à faire."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Nouvelle version détectée : $NAME@$VERSION"
          fi

  release:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      # `contents` pour créer le tag et la Release, `id-token` pour l'OIDC npm.
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Historique complet : --generate-notes compare au tag précédent.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing n'existe qu'à partir de npm 11.5.1.
      - run: npm install --global npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

      # npm avant GitHub : c'est l'étape irréversible. Une Release ratée se
      # recrée à la main, une version npm publiée ne se reprend jamais.
      - run: npm publish

      - name: Taguer et créer la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --generate-notes
